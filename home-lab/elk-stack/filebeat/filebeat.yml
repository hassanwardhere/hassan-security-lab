filebeat.inputs:
- type: log
  enabled: true
  paths:
    - /var/ossec/logs/alerts/alerts.json
  json.keys_under_root: true
  json.add_error_key: true
  fields:
    module: wazuh
  fields_under_root: true

- type: log
  enabled: true
  paths:
    - /var/ossec/logs/archives/*.json
  json.keys_under_root: true
  fields:
    module: wazuh-archives
  fields_under_root: true

output.logstash:
  hosts: ["logstash:5044"]

logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0644
