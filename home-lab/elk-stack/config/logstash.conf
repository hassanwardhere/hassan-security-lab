input {
  beats {
    port => 5044
    host => "0.0.0.0"
  }
}

filter {
  # Parse Wazuh JSON alerts
  if [fields][module] == "wazuh" or [agent][type] == "wazuh-agent" {
    json {
      source => "message"
      target => "wazuh"
      skip_on_invalid_json => true
    }

    # Extract timestamp from Wazuh alert
    if [wazuh][timestamp] {
      date {
        match => ["[wazuh][timestamp]", "ISO8601"]
        target => "@timestamp"
      }
    }

    # Extract rule information
    if [wazuh][rule] {
      mutate {
        add_field => {
          "[wazuh][rule_level]" => "%{[wazuh][rule][level]}"
          "[wazuh][rule_description]" => "%{[wazuh][rule][description]}"
          "[wazuh][rule_id]" => "%{[wazuh][rule][id]}"
        }
      }
    }

    # Categorize by log type
    if [wazuh][syscheck] {
      mutate {
        add_field => { "log_type" => "file_integrity" }
      }
    } else if [wazuh][rootcheck] {
      mutate {
        add_field => { "log_type" => "rootkit_detection" }
      }
    } else if [wazuh][rule][groups] {
      mutate {
        add_field => { "log_type" => "security_alert" }
      }
    }

    # Add severity based on rule level
    if [wazuh][rule][level] {
      if [wazuh][rule][level] >= 12 {
        mutate { add_field => { "severity" => "critical" } }
      } else if [wazuh][rule][level] >= 8 {
        mutate { add_field => { "severity" => "high" } }
      } else if [wazuh][rule][level] >= 5 {
        mutate { add_field => { "severity" => "medium" } }
      } else {
        mutate { add_field => { "severity" => "low" } }
      }
    }
  }

  # Remove unnecessary fields
  mutate {
    remove_field => ["host", "input", "agent", "ecs", "tags", "cloud", "service"]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "wazuh-logs-%{+YYYY.MM.dd}"
    template_name => "wazuh"
  }

  # Debug output (optional - remove in production)
  # stdout { codec => rubydebug }
}
