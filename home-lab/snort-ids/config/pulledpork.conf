# PulledPork Configuration File
# Project: Home Lab IDS
# Author: Hassan Abdulahi Hassan

# Snort version
snort_version=3.1.0

# Rule file path
rule_path=/etc/snort/rules/snort.rules

# Local rules path
local_rules=/etc/snort/rules/local.rules

# Sid message map path
sid_msg=/etc/snort/sid-msg.map

# Sid changelog path
sid_changelog=/var/log/snort/sid_changes.log

# Temporary directory
temp_path=/tmp

# Rule URLs (requires subscription for VRT rules)
# rule_url=https://www.snort.org/reg-rules/|snortrules-snapshot.tar.gz|<oinkcode>

# Emerging Threats rules (open source)
rule_url=https://rules.emergingthreats.net/open-nogpl/snort-2.9.0/emerging.rules.tar.gz|emerging.rules.tar.gz

# Disablesid configuration
disablesid=/etc/snort/disablesid.conf

# Dropsid configuration
dropsid=/etc/snort/dropsid.conf

# Modifysid configuration
modifysid=/etc/snort/modifysid.conf

# Enablesid configuration
enablesid=/etc/snort/enablesid.conf

# IP blacklist URL
# blacklist_url=https://some.blacklist.url/list.txt

# Distro for SO rules
distro=Ubuntu-18-04

# Path to snort binary
snort_path=/usr/local/bin/snort

# Config file path
config_path=/etc/snort/snort.conf

# Logging level (0-2)
logging=1

# Keep the tarballs?
keep_tarball=0