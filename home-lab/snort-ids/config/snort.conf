# Snort Configuration File
# Project: Home Lab IDS
# Author: Hassan Abdulahi Hassan
# Description: Snort IDS configuration for detecting common attacks

#------------------------------------------------------------------------------
# Network Variables
#------------------------------------------------------------------------------
ipvar HOME_NET any
ipvar EXTERNAL_NET any
ipvar DNS_SERVERS $HOME_NET
ipvar SMTP_SERVERS $HOME_NET
ipvar HTTP_SERVERS $HOME_NET
ipvar SQL_SERVERS $HOME_NET
ipvar TELNET_SERVERS $HOME_NET
ipvar SSH_SERVERS $HOME_NET
ipvar FTP_SERVERS $HOME_NET
ipvar SIP_SERVERS $HOME_NET

portvar HTTP_PORTS [80,81,82,83,84,85,86,87,88,89,90,311,383,591,593,901,1220,1414,1741,1830,2301,2381,2809,3037,3128,3702,4343,4848,5250,6988,7000,7001,7144,7145,7510,7777,7779,8000,8001,8008,8014,8028,8080,8085,8088,8090,8118,8123,8180,8181,8243,8280,8300,8800,8888,8899,9000,9060,9080,9090,9091,9443,9999,11371,34443,34444,41080,50002,55555]
portvar SHELLCODE_PORTS !80
portvar ORACLE_PORTS 1024:
portvar SSH_PORTS 22
portvar FTP_PORTS 21
portvar SIP_PORTS 5060:5061
portvar FILE_DATA_PORTS [$HTTP_PORTS,110,143]
portvar GTP_PORTS [2123,2152,3386]

#------------------------------------------------------------------------------
# Path Variables
#------------------------------------------------------------------------------
var RULE_PATH /etc/snort/rules
var SO_RULE_PATH /etc/snort/so_rules
var PREPROC_RULE_PATH /etc/snort/preproc_rules
var WHITE_LIST_PATH /etc/snort/rules
var BLACK_LIST_PATH /etc/snort/rules

#------------------------------------------------------------------------------
# Configure Plugins
#------------------------------------------------------------------------------
dynamicpreprocessor directory /usr/local/lib/snort_dynamicpreprocessor/
dynamicengine /usr/local/lib/snort_dynamicengine/libsf_engine.so
dynamicdetection directory /usr/local/lib/snort_dynamicrules

#------------------------------------------------------------------------------
# Preprocessors
#------------------------------------------------------------------------------
preprocessor normalize_ip4
preprocessor normalize_tcp: ips ecn stream
preprocessor normalize_icmp4
preprocessor normalize_ip6
preprocessor normalize_icmp6

# Target-based - configure for your network
preprocessor frag3_global: max_frags 65536
preprocessor frag3_engine: policy first detect_anomalies overlap_limit 10 min_fragment_length 100 timeout 180

# Stream5 - TCP/UDP reassembly
preprocessor stream5_global: track_tcp yes, track_udp yes, track_icmp no, max_tcp 262144, max_udp 131072, max_active_responses 2, min_response_seconds 5
preprocessor stream5_tcp: policy windows, detect_anomalies, require_3whs 180, overlap_limit 10, small_segments 3 bytes 150, timeout 180, ports client 21 22 23 25 42 53 79 80 109 110 111 113 119 135 136 137 139 143 161 445 513 514 587 593 691 1433 1521 1741 2100 2301 3128 3306 6665 6666 6667 6668 6669 7000 7001 8000 8001 8080 8888 9999 32770 32771 32772 32773 32774 49152 49153
preprocessor stream5_udp: timeout 180

# HTTP inspection
preprocessor http_inspect: global iis_unicode_map unicode.map 1252 compress_depth 65535 decompress_depth 65535 max_gzip_mem 104857600
preprocessor http_inspect_server: server default \
    http_inspect [ \
    inspect_all yes, \
    oversize_dir_length 500, \
    max_headers 100, \
    max_spaces 200, \
    webroot on, \
    apache_whitespace yes, \
    iis_delimiter yes, \
    chunk_length 500000, \
    small_chunk_length { 10 10 }, \
    inspect_vba_jscript yes, \
    inspect_js_response yes \
    ]

# RPC Decode
preprocessor rpc_decode: 111 32770 32771 32772 32773 32774 32775 32776 32777 32778 32779 no_alert_multiple_requests no_alert_large_fragments no_alert_incomplete

# Bo - Back Orifice detection
preprocessor bo

# FTP/Telnet
preprocessor ftp_telnet: global inspection_type stateful encrypted_traffic no check_encrypted
preprocessor ftp_telnet_protocol: telnet \
    ayt_attack_thresh 200 \
    normalize ports { 23 } \
    detect_anomalies
preprocessor ftp_telnet_protocol: ftp server default \
    def_max_param_len 100 \
    ports { 21 2100 3535 } \
    ftp_cmds { XPWD XCWD XCUP XMKD XRMD } \
    alt_max_param_len 0 { ABOR CCC CDUP HELP MODE NLST PASS PWD QUIT REIN STAT STOU SYST XCUP XCWD XMKD XPWD XRMD } \
    ignore_cmds { MDTM REST SIZE MLST MLSD } \
    chk_str_fmt { ACCT ADAT ALLO APPE AUTH CEL CMD CONF CWD DELE ENC EPRT EPSV ESTA ESTP FEAT HASH HELP LANG LIST MDTM MKD MLSD MLST MODE NLST OPTS PASS PBSZ PORT PROT PWD QUIT REIN REST RETR RMD RNFR RNTO SITE SIZE SMNT STAT STOR STRU SYST THSB TYPE USER XCUP XCWD XMKD XPWD XRMD } \
    cmd_validity MODE < char ASBCZ > \
    cmd_validity STRU < char FRP > \
    cmd_validity ALLO < int [ 1 R ] > \
    cmd_validity TYPE < { char AE [ char NTC ] | char I | char L [ number ] } > \
    cmd_validity MDTM < [ date nnnnnnnnnnnnnn[.n[n[n]]] ] string > \
    cmd_validity PORT < host_port >
preprocessor ftp_telnet_protocol: ftp client default \
    max_resp_len 256 \
    bounce yes \
    ignore_telnet_erase_cmds yes \
    telnet_cmds no

# SMTP
preprocessor smtp: ports { 25 465 587 691 } \
    inspection_type stateful \
    normalize cmds \
    normalize_cmds { ATRN AUTH BDAT CHUNKING DATA DEBUG EHLO EMAL ESAM ESND ESOM ETRN EVFY EXPN } \
    max_command_line_len 512 \
    max_header_line_len 1000 \
    max_response_line_len 512 \
    alt_max_command_line_len 260 { MAIL } \
    alt_max_command_line_len 300 { RCPT } \
    alt_max_command_line_len 500 { HELP HELO ETRN EHLO } \
    alt_max_command_line_len 255 { EXPN VRFY ATRN SIZE BDAT DEBUG EMAL ESAM ESND ESOM } \
    xlink2state { disable }

# SSH
preprocessor ssh: server_ports { 22 } \
    max_client_bytes 19600 \
    max_encrypted_packets 20 \
    max_server_version_len 100 \
    autodetect

# DNS
preprocessor dns: ports { 53 } enable_rdata_overflow

# SSL/TLS
preprocessor ssl: ports { 443 465 563 636 989 992 993 994 995 5061 }, trustservers no, noinspect_encrypted

# DCE/RPC
preprocessor dcerpc2: memcap 102400, events [co], keep_co_memcap
preprocessor dcerpc2_server: default, policy WinXP, detect [smb [139,445], tcp 135, udp 135, rpc-over-http-server 593], autodetect [tcp 135, udp 135, rpc-over-http-server 593], smb_max_chain 3

# Sensitive Data
preprocessor sensitive_data: alert_threshold 25

# SIP
preprocessor sip: max_sessions 10000, max_uri_len 512, max_call_id_len 80, max_requestName_len 20, max_from_len 256, max_to_len 256, max_via_len 1024, max_contact_len 512, max_content_len 2048, ports { 5060 5061 }, methods { invite cancel ack bye register options refer subscribe update join info message notify benotify do qauth sprack publish service unsubscribe prack }

# IMAP
preprocessor imap: ports { 143 } no_alerts

# POP
preprocessor pop: ports { 110 } no_alerts

# Modbus
preprocessor modbus: ports { 502 }

# DNP3
preprocessor dnp3: ports { 20000 } check_crc

# Reputation - Blacklist/Whitelist
preprocessor reputation: \
    memcap 500, \
    priority whitelist, \
    nested_ip inner, \
    whitelist $WHITE_LIST_PATH/white.list, \
    blacklist $BLACK_LIST_PATH/black.list

#------------------------------------------------------------------------------
# Output Configuration - JSON for ELK Integration
#------------------------------------------------------------------------------
output alert_fast: stdout
output unified2: filename snort.log, limit 128, nostamp, mpls_event_types, vlan_event_types

# JSON output for ELK Stack integration
output alert_json: /var/log/snort/alert.json

# Additional output options for logging
log unified2

#------------------------------------------------------------------------------
# Performance Configuration
#------------------------------------------------------------------------------
config detection: search-method ac-split search-optimize max-pattern-len 20
config event_queue: max_queue 8 log 5 order_events content_length
config pcre_match_limit: 1500
config pcre_match_limit_recursion: 1500
config detection: alert-before-pass no

#------------------------------------------------------------------------------
# Include Rules
#------------------------------------------------------------------------------
include $RULE_PATH/local.rules